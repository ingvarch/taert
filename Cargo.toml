[package]
name = "taert"
version = "0.5.0"
edition = "2024"
authors = ["Igor <ingvarch>"]
description = "Fast, transparent, and keyboard-driven macOS disk cleanup and storage explorer"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
# The feature counts wrapped lines the way the renderer does.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
jwalk = "0.8"
rayon = "1.10"
libc = "0.2"
plist = "1"
sysinfo = "0.33"
unicode-width = "0.2"
# Pinned: 0.20 and newer read `/system/df` only in the API 1.52 shape, and every
# daemon before Docker 29 then comes back empty with no error. API 1.49 gets the
# older shape from all daemons, new ones included.
bollard = { version = "=0.19.4", default-features = false, features = ["pipe"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
trash = { version = "5.2.9", default-features = false }

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
