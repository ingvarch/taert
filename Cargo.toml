[package]
name = "taert"
version = "0.0.0"
edition = "2024"
authors = ["Igor <ingvarch>"]
description = "Fast, transparent, and keyboard-driven macOS disk cleanup and storage explorer"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
jwalk = "0.8"
rayon = "1.10"
libc = "0.2"
sysinfo = "0.33"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
